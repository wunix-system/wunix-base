[package]
name = "wspd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Системный фоновый демон проверки обновлений WSP (Wunix System Package Daemon)"

[dependencies]
libwunix = { path = "../../wunix/libs/libwunix" }
libpackwunix = { path = "../../wunix/libs/libpackwunix", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
