[package]
name = "netutils"
version = "auto"
arch = "x86_64"
type = "system"
tier = "base"
description = "Сетевые системные утилиты и служба синхронизации времени Wunix"
maintainer = "Wunix Core Team <dev@wunix.org>"

[dependencies]
required = ["libwunix >= 0.1"]
conflicts = []
replaces = []

[build]
version_source = "git:programs"
bins = ["ip", "ping", "host", "ss", "ntpdate", "timesyncd"]

[build.symlinks]
"/bin/nslookup" = "host"
