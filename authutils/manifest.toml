[package]
name = "authutils"
version = "auto"
arch = "x86_64"
type = "system"
tier = "base"
description = "Системные утилиты аутентификации, разграничения прав и управления пользователями"
maintainer = "Wunix Core Team <dev@wunix.org>"

[dependencies]
required = ["libwunix >= 0.1"]
conflicts = []
replaces = []

[build]
version_source = "git:programs"
bins = ["passwd", "su", "sudo", "sudoadd", "login", "useradd", "userdel"]
